<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Tree Interactive Visualization</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fafafa;
    color: #333;
    overflow: hidden;
  }

  #container {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    min-width: 260px;
    background: #fff;
    border-right: 1px solid #e5e7eb;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #sidebar h1 {
    font-size: 16px;
    font-weight: 700;
    color: #111;
    margin-bottom: 4px;
  }
  #sidebar h2 {
    font-size: 13px;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #444;
    margin-bottom: 4px;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .layer-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #444;
    cursor: pointer;
    padding: 4px 0;
  }
  .layer-toggle input { cursor: pointer; }

  /* Info panel */
  #info-panel {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    line-height: 1.6;
    display: none;
  }
  #info-panel.visible { display: block; }
  #info-panel .label {
    font-weight: 600;
    color: #666;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  #info-panel .value {
    font-weight: 500;
    color: #111;
    font-size: 13px;
  }
  #info-panel .formula-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 12px;
    color: #fff;
  }

  .stats-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    border-bottom: 1px solid #f0f0f0;
  }

  .hint {
    font-size: 11px;
    color: #999;
    font-style: italic;
  }

  /* Main SVG area */
  #viz {
    flex: 1;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    background: #fafafa;
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    max-width: 250px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .tooltip.visible { opacity: 1; }

  /* Layer column labels */
  .layer-label {
    font-size: 13px;
    font-weight: 600;
    fill: #888;
    text-anchor: middle;
  }
  .layer-sublabel {
    font-size: 11px;
    fill: #aaa;
    text-anchor: middle;
  }
  .layer-line {
    stroke: #e5e7eb;
    stroke-width: 1;
    stroke-dasharray: 4 4;
  }
</style>
</head>
<body>

<div id="container">
  <div id="sidebar">
    <div>
      <h1>Feature Tree</h1>
      <p class="hint">Click a node to trace its circuit</p>
    </div>

    <div>
      <h2>Formula Types</h2>
      <div class="legend-item"><div class="legend-dot" style="background:#9ca3af"></div> Atomic (layer 0)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div> AND</div>
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> OR</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> AND_NOT</div>
      <div class="legend-item" style="margin-top:4px;"><div style="width:12px;height:2px;background:#ef4444;flex-shrink:0;"></div> Negated edge</div>
    </div>

    <div>
      <h2>Layers</h2>
      <div id="layer-toggles"></div>
    </div>

    <div>
      <h2>Node Size</h2>
      <p class="hint">Radius = activation rate</p>
    </div>

    <div id="info-panel">
      <div id="info-content"></div>
    </div>
  </div>

  <div id="viz">
    <div class="tooltip" id="tooltip"></div>
  </div>
</div>

  const height = container.clientHeight;

  const parentsOf = {};   // nodeId -> [{source, negated}]
  const nodeMap = {};     // nodeId -> node data

    childrenOf[n.id] = [];
    parentsOf[n.id] = [];

    const label = document.createElement('label');
    label.className = 'layer-toggle';
    label.innerHTML = `<input type="checkbox" checked data-layer="${l.index}">
      L${l.index}: ${l.name} (${l.num_features})`;

      layerVisible[l.index] = e.target.checked;

    const layerCfg = data.layers[n.layer];
    const nFeats = layerCfg.num_features;
    const ySpan = height - margin.top - margin.bottom;
    const spacing = ySpan / (nFeats + 1);
    n.x = layerX[n.layer];
    n.y = margin.top + spacing * (n.index + 1);

    .append('svg')
    .attr('width', width)
    .attr('height', height);

    .scaleExtent([0.3, 5])
    .on('zoom', e => g.attr('transform', e.transform));

    layerG.append('line')
      .attr('class', 'layer-line')
      .attr('x1', x).attr('x2', x)
      .attr('y1', margin.top - 10).attr('y2', height - margin.bottom);
    layerG.append('text')
      .attr('class', 'layer-label')
      .attr('x', x).attr('y', 20)
      .text(`L${l.index}: ${l.name}`);
    layerG.append('text')
      .attr('class', 'layer-sublabel')
      .attr('x', x).attr('y', 36)
      .text(`${l.num_features} features`);
  });

  // Edges
  const edgeG = g.append('g').attr('class', 'edges');
  const edgeElements = edgeG.selectAll('path')
    .data(data.edges)
    .join('path')
    .attr('d', d => {
      const s = nodeMap[d.source];
      const t = nodeMap[d.target];
      const dx = t.x - s.x;
      return `M${s.x},${s.y} C${s.x + dx * 0.4},${s.y} ${t.x - dx * 0.4},${t.y} ${t.x},${t.y}`;
    })
    .attr('fill', 'none')
    .attr('stroke', d => d.negated ? '#ef4444' : '#94a3b8')
    .attr('stroke-width', d => d.negated ? 1.2 : 0.7)
    .attr('stroke-opacity', d => d.negated ? 0.5 : 0.35)
    .attr('stroke-dasharray', d => d.negated ? '4 2' : 'none');

  // Nodes
  const nodeG = g.append('g').attr('class', 'nodes');
  const nodeElements = nodeG.selectAll('circle')
    .data(data.nodes)
    .join('circle')
    .attr('cx', d => d.x)
    .attr('cy', d => d.y)
    .attr('r', d => Math.max(2.5, d.activation_rate * 25))
    .attr('fill', d => colors[d.type] || '#888')
    .attr('stroke', '#fff')
    .attr('stroke-width', 0.5)
    .attr('cursor', 'pointer')
    .on('mouseover', onHover)
    .on('mousemove', onMove)
    .on('mouseout', onOut)
    .on('click', onClick);

  // Tooltip
  const tooltip = document.getElementById('tooltip');

  function onHover(event, d) {
    const parents = parentsOf[d.id].map(e =>
      `${e.source}${e.negated ? ' (NOT)' : ''}`
    ).join(', ');
    tooltip.innerHTML = `<strong>${d.id}</strong><br>
      Type: ${d.type}<br>
      Activation: ${(d.activation_rate * 100).toFixed(1)}%
      ${d.layer > 0 ? '<br>Parents: ' + parents : ''}`;
    tooltip.classList.add('visible');
  }
  function onMove(event) {
    const rect = container.getBoundingClientRect();
    tooltip.style.left = (event.clientX - rect.left + 15) + 'px';
    tooltip.style.top = (event.clientY - rect.top - 10) + 'px';
  }
  function onOut() {
    tooltip.classList.remove('visible');
  }

  // Click: trace circuit
  let selectedNode = null;

  function onClick(event, d) {
    event.stopPropagation();

    if (selectedNode === d.id) {
      // Deselect
      selectedNode = null;
      resetHighlight();
      hideInfoPanel();
      return;
    }

    selectedNode = d.id;
    const traced = traceCircuit(d.id);
    highlightCircuit(traced);
    showInfoPanel(d, traced);
  }

  svg.on('click', () => {
    selectedNode = null;
    resetHighlight();
    hideInfoPanel();
  });

  function traceCircuit(nodeId) {
    const traced = new Set([nodeId]);
    // Backward: ancestors
    let frontier = [nodeId];
    while (frontier.length > 0) {
      const next = [];
      frontier.forEach(nid => {
        (parentsOf[nid] || []).forEach(e => {
          if (!traced.has(e.source)) {
            traced.add(e.source);
            next.push(e.source);
          }
        });
      });
      frontier = next;
    }
    // Forward: descendants
    frontier = [nodeId];
    while (frontier.length > 0) {
      const next = [];
      frontier.forEach(nid => {
        (childrenOf[nid] || []).forEach(e => {
          if (!traced.has(e.target)) {
            traced.add(e.target);
            next.push(e.target);
          }
        });
      });
      frontier = next;
    }
    return traced;
  }

  function highlightCircuit(traced) {
    nodeElements.transition().duration(300)
      .attr('opacity', d => traced.has(d.id) ? 1 : 0.06)
      .attr('r', d => traced.has(d.id)
        ? Math.max(4, d.activation_rate * 30)
        : Math.max(1.5, d.activation_rate * 15));

    edgeElements.transition().duration(300)
      .attr('stroke-opacity', d =>
        traced.has(d.source) && traced.has(d.target)
          ? (d.negated ? 0.7 : 0.5)
          : 0.02)
      .attr('stroke-width', d =>
        traced.has(d.source) && traced.has(d.target)
          ? (d.negated ? 2 : 1.5)
          : 0.3)
      .attr('stroke', d =>
        traced.has(d.source) && traced.has(d.target)
          ? (d.negated ? '#ef4444' : colors[nodeMap[d.target].type] || '#94a3b8')
          : '#e2e8f0');
  }

  function resetHighlight() {
    nodeElements.transition().duration(300)
      .attr('opacity', 1)
      .attr('r', d => Math.max(2.5, d.activation_rate * 25));

    edgeElements.transition().duration(300)
      .attr('stroke', d => d.negated ? '#ef4444' : '#94a3b8')
      .attr('stroke-width', d => d.negated ? 1.2 : 0.7)
      .attr('stroke-opacity', d => d.negated ? 0.5 : 0.35);
  }

  // Info panel
  const infoPanel = document.getElementById('info-panel');
  const infoContent = document.getElementById('info-content');

  function showInfoPanel(d, traced) {
    const parents = parentsOf[d.id];
    const children = childrenOf[d.id];
    const tracedNodes = [...traced].map(id => nodeMap[id]);
    const layerCounts = {};
    tracedNodes.forEach(n => { layerCounts[n.layer] = (layerCounts[n.layer] || 0) + 1; });

    let html = `
      <div style="margin-bottom:8px;">
        <span class="formula-badge" style="background:${colors[d.type]}">${d.type}</span>
        <strong style="margin-left:6px;font-size:14px;">${d.id}</strong>
      </div>
      <div class="stats-row">
        <span class="label">Layer</span>
        <span class="value">${d.layer} (${data.layers[d.layer].name})</span>
      </div>
      <div class="stats-row">
        <span class="label">Activation rate</span>
        <span class="value">${(d.activation_rate * 100).toFixed(1)}%</span>
      </div>`;

    if (parents.length > 0) {
      const parentStr = parents.map(e =>
        `<span style="color:${e.negated ? '#ef4444' : '#3b82f6'}">${e.source}${e.negated ? ' (NOT)' : ''}</span>`
      ).join(', ');
      html += `<div class="stats-row">
        <span class="label">Parents</span>
        <span class="value">${parentStr}</span>
      </div>`;
    }

    html += `<div class="stats-row">
      <span class="label">Children</span>
      <span class="value">${children.length}</span>
    </div>`;

    html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #e5e7eb;">
      <span class="label">Circuit size</span><br>`;
    data.layers.forEach(l => {
      const count = layerCounts[l.index] || 0;
      if (count > 0) {
        html += `<span style="font-size:12px;color:#666;">L${l.index} (${l.name}): ${count} nodes</span><br>`;
      }
    });
    html += `<span style="font-size:12px;font-weight:600;color:#111;">Total: ${traced.size} nodes</span></div>`;

    infoContent.innerHTML = html;
    infoPanel.classList.add('visible');
  }

  function hideInfoPanel() {
    infoPanel.classList.remove('visible');
  }

  // Layer visibility
  function updateVisibility() {
    nodeElements.attr('display', d => layerVisible[d.layer] ? null : 'none');
    edgeElements.attr('display', d => {
      const sl = nodeMap[d.source].layer;
      const tl = nodeMap[d.target].layer;
      return (layerVisible[sl] && layerVisible[tl]) ? null : 'none';
    });
  }

  // Initial zoom to fit
  const allX = data.nodes.map(n => n.x);
  const allY = data.nodes.map(n => n.y);
  const bounds = {
    x: d3.min(allX) - 30, y: d3.min(allY) - 30,
    w: d3.max(allX) - d3.min(allX) + 60,
    h: d3.max(allY) - d3.min(allY) + 60,
  };
  const scale = Math.min(width / bounds.w, height / bounds.h) * 0.9;
  const tx = width / 2 - (bounds.x + bounds.w / 2) * scale;
  const ty = height / 2 - (bounds.y + bounds.h / 2) * scale;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}
</script>

</body>
</html>
